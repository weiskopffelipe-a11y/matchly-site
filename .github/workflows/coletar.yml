# Robô de coleta: roda sozinho a cada 3 horas e pode ser disparado à mão
# (aba Actions → "Coletar vagas" → Run workflow).
name: Coletar vagas

on:
  schedule:
    - cron: "17 */3 * * *"      # minuto 17 de cada 3 horas (horário UTC)
  workflow_dispatch:

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar vagas nas empresas do radar
        run: node scripts/coletar.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          LOTE: ${{ vars.LOTE }}
          MAX_IA: ${{ vars.MAX_IA }}
